services:
  app:
    extends:
      file: ../deploy/compose.yml
      service: app
    build:
      dockerfile: .devcontainer/dockerfile
      target: build
    image: ghcr.io/feryardiant/learn-bun-elysia:devcontainer
    container_name: elysia-dev-app
    pull_policy: never
    ports:
      - ${FORWARD_APP_PORT:-3000}:3000
      - ${FORWARD_STUDIO_PORT:-4000}:4000
    volumes:
      - node_modules:/app/node_modules
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  postgres:
    extends:
      file: ../deploy/compose.yml
      service: postgres
    container_name: elysia-dev-db
    ports:
      - ${FORWARD_DB_PORT:-5432}:5432

  mailpit:
    extends:
      file: ../deploy/compose.yml
      service: mailpit
    container_name: elysia-dev-mail
    ports:
      # - ${FORWARD_SMTP_PORT:-1025}:1025
      - ${FORWARD_MAILPIT_PORT:-8025}:8025

  jaeger:
    extends:
      file: ../deploy/compose.yml
      service: jaeger
    container_name: elysia-dev-otel
    ports:
      - "${FORWARD_JAEGER_PORT:-16686}:16686"  # Jaeger UI
      # - "${FORWARD_OTLP_GRPC_PORT:-4317}:4317" # OTLP gRPC
      # - "${FORWARD_OTLP_HTTP_PORT:-4318}:4318" # OTLP HTTP

volumes:
  node_modules:
    name: elysia-dev-node_modules

networks:
  default:
    name: elysia-dev-stack
